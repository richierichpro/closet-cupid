[project]
name = "closet-cupid-backend"
version = "0.1.0"
description = "Closet Cupid: catalogue pipeline and self-learning style engine"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.33",
    "anthropic>=2.3.0",
    "opencv-python-headless>=4.10,<5",
]

[project.optional-dependencies]
# Only the catalogue builder needs the vision model; the engine runs without it.
vision = [
    "torch>=2.4",
    "torchvision",
    "open_clip_torch>=2.26",
    "transformers>=4.44",
    "sentencepiece>=0.2",
    "pillow>=10.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

# On Linux servers, the CPU-only PyTorch build: the CUDA one is gigabytes the server can't use.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
